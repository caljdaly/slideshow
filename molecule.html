<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structure Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --ground: #0a0c12; --surface: #12151e; --surface-2: #1a1e2a; --line: #262b3a;
    --text: #e7eaf3; --muted: #7e8799;
    --violet: #7c5cff; --cyan: #4fd1ff; --magenta: #ff6bd6; --danger: #ff6b9a;
    --accent: var(--cyan); --accent-ink: #062226;
    --display: "Chakra Petch", "Bahnschrift", "DIN Alternate", sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--body); font-size: 13px; line-height: 1.4; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .frame { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  .rail-top {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .eyebrow { font-family: var(--display); font-weight: 600; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .eyebrow .tick { width: 6px; height: 6px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  form { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  input[type=text] {
    width: 96px; height: 32px; padding: 0 10px; background: var(--surface); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--text);
  }
  input[type=text]::placeholder { color: var(--muted); letter-spacing: .06em; text-transform: none; font-family: var(--body); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid var(--line); background: var(--surface);
    font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; transition: border-color .15s, color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { background: #8ae1ff; color: var(--accent-ink); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(79,209,255,.08); }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .stage { position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 110%, rgba(124,92,255,.10), transparent 60%), var(--ground); }
  #view { position: absolute; inset: 0; }
  .caption {
    position: absolute; left: 12px; bottom: 10px; right: 12px; pointer-events: none;
    display: flex; flex-direction: column; gap: 2px;
  }
  .caption .id { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--accent); }
  .caption .name { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
  .notice { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; text-align: center; padding: 24px; z-index: 2; background: rgba(10,12,18,.7); }
  .notice h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
  .notice p { margin: 0; color: var(--muted); max-width: 40ch; }
  .notice.error h2 { color: var(--danger); }

  .rail { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .group { display: flex; gap: 6px; }
  .presets { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .chip {
    height: 26px; padding: 0 9px; border: 1px solid var(--line); background: transparent;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--muted); transition: color .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip[aria-current="true"] { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 560px) { .presets { display: none; } .btn .label { display: none; } }
</style>
</head>
<body>
<div class="frame">
  <div class="rail-top">
    <div class="eyebrow"><span class="tick" aria-hidden="true"></span><span>structure viewer</span></div>
    <form id="form">
      <label for="pdb" class="eyebrow" style="letter-spacing:.1em">PDB</label>
      <input type="text" id="pdb" placeholder="e.g. 1HHO" maxlength="4" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit"><span class="label">Load</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </div>

  <div class="stage">
    <div id="view"></div>
    <div class="caption"><div class="id" id="capId"></div><div class="name" id="capName"></div></div>
    <div class="notice" id="notice"><h2 id="noticeTitle">Loading viewer…</h2><p id="noticeText"></p></div>
  </div>

  <div class="rail">
    <div class="group" role="group" aria-label="Style">
      <button class="btn" id="stCartoon" type="button" aria-pressed="true">Cartoon</button>
      <button class="btn" id="stSticks" type="button" aria-pressed="false">Sticks</button>
      <button class="btn" id="stSurface" type="button" aria-pressed="false">Surface</button>
    </div>
    <div class="group">
      <button class="btn icon" id="spinBtn" type="button" aria-pressed="true" aria-label="Spin" title="Spin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
      </button>
      <button class="btn icon" id="fitBtn" type="button" aria-label="Recentre" title="Recentre">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
    </div>
    <div class="presets" id="presets" aria-label="Examples"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<script>
(function () {
  // Quick picks — swap these for whatever the unit is on.
  const PRESETS = [
    ['1HHO', 'Hemoglobin'], ['1UBQ', 'Ubiquitin'], ['1LYZ', 'Lysozyme'], ['2PTC', 'Trypsin·BPTI'],
    ['1BNA', 'B-DNA'], ['1AOI', 'Nucleosome'], ['6VXX', 'SARS-CoV-2 spike'], ['1ATP', 'PKA·ATP'],
  ];
  const DEFAULT_ID = '1HHO';   // what opens when nothing else is asked for

  const $ = (id) => document.getElementById(id);
  const el = { form: $('form'), pdb: $('pdb'), view: $('view'), capId: $('capId'), capName: $('capName'),
    notice: $('notice'), noticeTitle: $('noticeTitle'), noticeText: $('noticeText'),
    stCartoon: $('stCartoon'), stSticks: $('stSticks'), stSurface: $('stSurface'), spinBtn: $('spinBtn'), fitBtn: $('fitBtn'), presets: $('presets') };

  let viewer = null;
  let style = { cartoon: true, sticks: false, surface: false };
  let spinning = true;
  let currentId = '';
  let surfaceHandle = null;

  function setNotice(t, x, err) { el.noticeTitle.textContent = t; el.noticeText.textContent = x || ''; el.notice.classList.toggle('error', !!err); el.notice.hidden = false; }
  function hideNotice() { el.notice.hidden = true; }

  function applyStyle() {
    if (!viewer) return;
    const s = {};
    if (style.cartoon) s.cartoon = { color: 'spectrum', opacity: 1 };
    if (style.sticks) s.stick = { radius: 0.18, colorscheme: 'Jmol' };
    if (!style.cartoon && !style.sticks) s.line = { colorscheme: 'Jmol' };
    viewer.setStyle({}, s);
    // hetero ligands always as sticks so they don't vanish inside the cartoon
    viewer.setStyle({ hetflag: true, not: { resn: ['HOH', 'WAT'] } }, { stick: { radius: 0.22, colorscheme: 'Jmol' } });
    viewer.removeAllSurfaces(); surfaceHandle = null;
    if (style.surface) {
      surfaceHandle = viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.55, color: '#4fd1ff' }, { hetflag: false });
    }
    viewer.render();
    el.stCartoon.setAttribute('aria-pressed', style.cartoon);
    el.stSticks.setAttribute('aria-pressed', style.sticks);
    el.stSurface.setAttribute('aria-pressed', style.surface);
  }

  function setSpin(on) {
    spinning = on;
    if (viewer) viewer.spin(on ? 'y' : false, on ? 0.6 : 0);
    el.spinBtn.setAttribute('aria-pressed', on);
  }

  async function describe(id) {
    el.capId.textContent = id; el.capName.textContent = '';
    try {
      const r = await fetch('https://data.rcsb.org/rest/v1/core/entry/' + id);
      if (!r.ok) return;
      const j = await r.json();
      const title = j?.struct?.title;
      if (title && currentId === id) el.capName.textContent = title.charAt(0) + title.slice(1).toLowerCase();
    } catch (_) { /* caption stays as the id */ }
  }

  function load(idRaw) {
    const id = String(idRaw || '').trim().toUpperCase();
    if (!/^[0-9][A-Z0-9]{3}$/.test(id)) { setNotice('That doesn’t look like a PDB ID', 'IDs are four characters starting with a digit, like 1HHO.', true); return; }
    if (!viewer) return;
    currentId = id;
    el.pdb.value = id;
    setNotice('Fetching ' + id + '…');
    viewer.clear();
    $3Dmol.download('pdb:' + id, viewer, { doAssembly: false, multimodel: false }, function (model) {
      if (!model || !model.selectedAtoms({}).length) {
        setNotice('Nothing came back for ' + id, 'Check the ID on rcsb.org — it may be withdrawn or an mmCIF-only entry.', true); return;
      }
      applyStyle();
      viewer.zoomTo(); viewer.render();
      setSpin(spinning);
      hideNotice();
      describe(id);
      try { localStorage.setItem('structure-last', id); } catch (_) {}
      Array.from(el.presets.children).forEach(c => c.setAttribute('aria-current', c.dataset.id === id ? 'true' : 'false'));
    }, function () {
      setNotice('Could not fetch ' + id, 'RCSB didn’t answer — check the ID or your connection.', true);
    });
  }

  // ---- wiring
  PRESETS.forEach(([id, name]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id;
    b.textContent = id; b.title = name; b.addEventListener('click', () => load(id)); el.presets.appendChild(b);
  });
  el.form.addEventListener('submit', (e) => { e.preventDefault(); load(el.pdb.value); });
  el.stCartoon.addEventListener('click', () => { style.cartoon = !style.cartoon; applyStyle(); });
  el.stSticks.addEventListener('click', () => { style.sticks = !style.sticks; applyStyle(); });
  el.stSurface.addEventListener('click', () => { style.surface = !style.surface; applyStyle(); });
  el.spinBtn.addEventListener('click', () => setSpin(!spinning));
  el.fitBtn.addEventListener('click', () => { if (viewer) { viewer.zoomTo(); viewer.render(); } });
  // Pause the spin while the user is dragging, resume after.
  el.view.addEventListener('pointerdown', () => { if (viewer && spinning) viewer.spin(false); });
  window.addEventListener('pointerup', () => { if (viewer && spinning) viewer.spin('y', 0.6); });

  if (!window.$3Dmol) { setNotice('Viewer didn’t load', 'The 3Dmol library couldn’t be fetched. Check your connection and reload.', true); return; }
  viewer = $3Dmol.createViewer(el.view, { backgroundColor: '#0a0c12', antialias: true });

  const fromUrl = new URLSearchParams(location.search).get('pdb');
  let last = ''; try { last = localStorage.getItem('structure-last') || ''; } catch (_) {}
  load(fromUrl || last || DEFAULT_ID);
})();
</script>
</body>
</html>
