<title>Night Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&family=DotGothic16&display=swap">
<style>
/* Layout: full-bleed WebGL tape feed; sparse on-screen display in the corners; Eva-style title cards over the feed. */
@font-face{
  font-family:"NT Eva";
  src:local("EPSON True Regular Script Medium"),local("EPSONTrueRegularScriptMedium"),local("EPSON 太明朝体Ｂ"),local("EPSON-Taiminchotai-B"),local("EPSON Taiminchotai B"),local("Matisse EB"),local("FOT-Matisse Pro EB"),local("FOT-MatissePro-EB");
}
:root{
  --ink:#05030a; --osd:#f3eef8; --dim:rgba(243,238,248,.58);
  --n0:#ff2bd6; --n1:#20e3ff; --blood:#ff2a3a;
  --f-eva:"NT Eva","EPSON True Regular Script Medium","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-arc:"Press Start 2P",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
#hud,#count{visibility:hidden}
/* in-race HUD: green phosphor terminal */
#hud{--ph:#6dff9a;--ph-dim:rgba(109,255,154,.5);--ph-faint:rgba(109,255,154,.14);--ph-ink:#021006;--f-term:"VT323",ui-monospace,Menlo,monospace}
.term{font-family:var(--f-term);font-weight:400;color:var(--ph);font-size:clamp(18px,1.75vw,24px);line-height:1.02;letter-spacing:.02em;
  text-shadow:0 0 5px rgba(109,255,154,.7),0 0 14px rgba(109,255,154,.28)}
.term .dim{color:var(--ph-dim)}
.term .inv{background:var(--ph);color:var(--ph-ink);padding:0 .28em;text-shadow:none;box-shadow:0 0 10px rgba(109,255,154,.45)}
.tbox{border:1px solid var(--ph-dim);padding:6px 10px 7px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),rgba(2,12,6,.55)}
.corner.tgrid,.tgrid{display:grid;grid-template-columns:auto auto;gap:3px 14px;align-items:center}
.tgrid .inv{text-align:right;font-variant-numeric:tabular-nums}
.posbig{font-size:clamp(40px,4.6vw,64px);line-height:.9}
.posbig .dim{font-size:.45em}
#instr{width:clamp(230px,24vw,330px);height:auto;display:block}
#toast.term{font-size:clamp(22px,2.4vw,32px)}
#count.term{font-family:var(--f-term);font-weight:400;color:var(--ph);transform:none;font-size:clamp(140px,28vw,340px);
  text-shadow:0 0 18px rgba(109,255,154,.8),0 0 50px rgba(109,255,154,.35)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--osd)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;font-family:var(--f-eva);font-weight:800}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.osd{font-family:var(--f-eva);font-weight:800;color:var(--osd);font-size:clamp(16px,1.9vw,24px);line-height:1.1;letter-spacing:.03em;
  text-shadow:2px 0 rgba(255,40,120,.45),-2px 0 rgba(60,220,255,.45),0 0 12px rgba(243,238,248,.2)}
.corner{position:absolute;display:flex;flex-direction:column;gap:5px}
.tl{top:calc(18px + env(safe-area-inset-top,0px));left:20px}
.tr{top:calc(18px + env(safe-area-inset-top,0px));right:20px;align-items:flex-end}
.bl{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:20px}
.br{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:12px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.place{font-family:var(--f-arc);font-weight:400;font-size:clamp(28px,3.6vw,48px);line-height:1;color:#fff;
  text-shadow:3px 3px 0 rgba(0,0,0,.6),0 0 14px var(--n0)}
.place sup{font-size:.42em;vertical-align:top;margin-left:2px}
.place small{font-size:.34em;color:var(--dim);margin-left:6px;text-shadow:none}
#gauge{width:clamp(150px,17vw,220px);height:auto;display:block}
.dimmed{color:var(--dim)}
#toast{position:absolute;top:22%;left:0;right:0;text-align:center;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:safe center;padding-inline:clamp(20px,6vw,100px);padding-block:32px;box-sizing:border-box;overflow-y:auto}
#title{background:none;justify-content:flex-start;padding-top:clamp(22px,6vh,90px)}
.hits{position:absolute;inset:0;pointer-events:none}
.hits input{position:absolute;pointer-events:auto;background:transparent;border:0;outline:0;color:transparent;caret-color:transparent;font:16px monospace;padding:0;margin:0}
#lobby{background:none}
.hits button{position:absolute;pointer-events:auto;background:transparent;border:0;padding:0;margin:0;cursor:pointer;color:transparent}
.hits button:focus-visible{outline:1px dashed rgba(243,238,248,.6);outline-offset:2px}
.ep{font-size:clamp(13px,1.5vw,19px);letter-spacing:.3em;color:var(--dim);margin-bottom:8px}
.evatitle{font-family:var(--f-eva);font-weight:800;line-height:.86;margin:0;color:#fff;transform:scaleX(.84);transform-origin:left center;text-shadow:0 0 18px rgba(255,255,255,.18)}
.evatitle .l1,.evatitle .l2{display:block;font-size:clamp(46px,min(12vw,13vh),160px)}
.evatitle .l2{padding-left:.5em}
.jp{font-size:clamp(18px,2.3vw,30px);margin:12px 0 2px;color:#fff;transform:scaleX(.84);transform-origin:left}
.sub{font-size:clamp(13px,1.4vw,18px);letter-spacing:.1em;color:var(--dim);max-width:52ch;font-weight:800}
.press{margin-top:18px}
.press .key{color:var(--n1)}
.label{margin-top:16px;font-size:clamp(12px,1.2vw,15px);letter-spacing:.24em;color:var(--dim)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;max-width:680px}
.picks button{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid rgba(243,238,248,.2);background:rgba(10,6,20,.55);color:var(--dim);
  font-family:var(--f-eva);font-weight:800;font-size:13px;letter-spacing:.1em;cursor:pointer}
.picks button[aria-pressed="true"]{color:#fff;border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.22)}
.picks.tracks button{padding:9px 14px;font-size:15px}
.picks.tracks small{color:var(--dim);font-size:12px}
.sw{display:flex;gap:2px}
.sw i{width:7px;height:14px;display:block}
.sens{display:flex;align-items:center;gap:12px;margin-top:7px;max-width:420px;font-size:15px;color:#fff}
.sens input{flex:1;accent-color:var(--n1);height:20px;cursor:pointer}
.sens span{min-width:4.5ch;text-align:right;font-variant-numeric:tabular-nums}
.setbtn{color:#fff!important;border-color:rgba(243,238,248,.5)!important}
#records{background:none}
/* mini terminal HUDs: same face, colour and glow as the in-race readout */
:root{--hud:#f9a63c;--hud-d:rgba(249,166,60,.55);--hud-f:rgba(249,166,60,.22);--hud-g:rgba(249,166,60,.6)}
.mhuds{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;max-width:900px}
.mhud{font-family:"DotGothic16","VT323",monospace;font-weight:400;color:var(--hud);border:1px solid var(--hud-d);width:min(100%,410px);box-sizing:border-box;padding:10px 12px 12px;position:relative;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px),rgba(4,3,9,.66);
  text-shadow:0 0 4px var(--hud-g),0 0 12px var(--hud-f),1px 0 rgba(255,40,120,.3),-1px 0 rgba(60,220,255,.3);
  box-shadow:inset 0 0 22px var(--hud-f),0 0 12px var(--hud-f);animation:mflick 5s infinite steps(1)}
@keyframes mflick{0%,100%{opacity:1}47%{opacity:.9}48%{opacity:1}74%{opacity:.95}75%{opacity:1}}
.mhud .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--hud-d);letter-spacing:.06em;margin-bottom:9px}
.mhud .arw{display:flex;gap:6px;flex:none}
.mhud button{font:inherit;font-size:13px;color:var(--hud);background:transparent;border:1px solid var(--hud-d);padding:2px 8px;cursor:pointer;text-shadow:inherit}
.mhud button:hover,.mhud button:focus-visible{background:var(--hud);color:#0a0610;text-shadow:none;outline:none}
.mhud .mrow{display:flex;gap:12px;align-items:center}
.mhud .ico{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 4px var(--hud-g))}
.mhud .mname{font-size:22px;line-height:1.15;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.mhud .cur{display:inline-block;width:.5em;height:.9em;background:var(--hud);vertical-align:-1px;margin-left:4px;animation:blink 1s steps(1) infinite}
.mhud .ticker{overflow:hidden;white-space:nowrap;font-size:13px;margin-top:6px;color:var(--hud-d);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mhud .ticker>div{display:inline-block;animation:tick 22s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mhud .sws{display:flex;gap:6px;margin:2px 0 8px}
.mhud .sws i{width:20px;height:20px;display:block;box-shadow:0 0 9px currentColor}
.mhud .sub2{font-size:13px;color:var(--hud-d);margin-top:4px;letter-spacing:.04em}
.mhud .rtab{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 14px;font-size:14px;margin-top:8px}
.mhud .rtab .hd{color:var(--hud-d)}
.mhud .big2{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:16px}
.mhud .big2 span:nth-child(odd){color:var(--hud-d)}
@media (prefers-reduced-motion:reduce){ .mhud,.mhud .ticker>div{animation:none} }
#settings{font-family:"DotGothic16","VT323",monospace;font-weight:400;color:#f3eef8;filter:blur(.35px);
  text-shadow:0 0 5px rgba(243,238,248,.5),0 0 14px rgba(243,238,248,.15),1px 0 rgba(255,40,120,.45),-1px 0 rgba(60,220,255,.45);animation:vjit 3.7s steps(1) infinite}
#settings::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
@keyframes vjit{0%,100%{transform:none}31%{transform:translateX(1.5px)}32%{transform:none}63%{transform:translateX(-1px)}64%{transform:none}88%{transform:translateX(2px) skewX(-.4deg)}89%{transform:none}}
#settings .vtitle{font-size:32px;letter-spacing:.06em}
#settings .tabs button,#settings .picks button{border:0;background:none;box-shadow:none;font-family:inherit;font-weight:400;font-size:16px;color:rgba(243,238,248,.5);padding:2px 8px;letter-spacing:.06em;text-shadow:inherit}
#settings .tabs button[aria-pressed="true"],#settings .picks button[aria-pressed="true"]{background:#f3eef8;color:#0a0610;text-shadow:none;box-shadow:0 0 12px rgba(243,238,248,.45)}
#settings .picks button:hover{color:#fff}
#settings .slabel{font-size:16px;letter-spacing:.08em;color:rgba(243,238,248,.6)}
#settings .slabel small{font-size:12px;letter-spacing:.04em}
#settings .srange{font-size:16px}
#settings .srange input{-webkit-appearance:none;appearance:none;height:16px;background:transparent}
#settings .srange input::-webkit-slider-runnable-track{height:2px;background:rgba(243,238,248,.45)}
#settings .srange input::-moz-range-track{height:2px;background:rgba(243,238,248,.45)}
#settings .srange input::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:16px;margin-top:-7px;background:#f3eef8;box-shadow:0 0 8px rgba(243,238,248,.7)}
#settings .srange input::-moz-range-thumb{width:8px;height:16px;border:0;border-radius:0;background:#f3eef8}
#settings .keys{font-size:15px}
#settings .keys b{font-weight:400}
#settings .sub{font-family:inherit;font-weight:400;font-size:13px}
#settings{background:linear-gradient(90deg,rgba(3,2,8,.94) 0%,rgba(3,2,8,.8) 60%,rgba(3,2,8,.45) 100%);justify-content:flex-start;padding-block:clamp(24px,6vh,60px)}
.tabs{margin-top:16px}
.tabs button{padding:8px 16px;font-size:15px}
.setgrid{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,440px);gap:12px 24px;align-items:center;margin-top:22px;max-width:700px}
.setgrid .slabel{font-size:13px;letter-spacing:.2em;color:var(--dim)}
.setgrid .slabel small{display:block;letter-spacing:.06em;font-size:11px;margin-top:3px;color:rgba(243,238,248,.4)}
.setgrid .picks{margin-top:0}
.srange{display:flex;align-items:center;gap:12px;font-size:15px;color:#fff}
.srange input{flex:1;min-width:0;accent-color:var(--n1);height:20px;cursor:pointer}
.srange span{min-width:5ch;text-align:right;font-variant-numeric:tabular-nums}
.setgrid .keys{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:14px;color:var(--dim);margin-top:8px}
.setgrid .keys b{color:#fff;font-weight:800}
@media (max-width:560px){ .setgrid{grid-template-columns:minmax(0,1fr)} .setgrid .slabel{margin-top:6px} }
.controls{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:clamp(12px,1.2vw,15px);color:var(--dim);max-width:460px}
.controls b{color:var(--osd);font-weight:800}
#count{position:absolute;inset:0;--ph:#6dff9a;--f-term:"VT323",monospace;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:clamp(120px,26vw,320px);color:#fff;transform:scaleX(.84);opacity:0;text-shadow:0 0 30px rgba(255,255,255,.3)}
#pause,#finish{background:none}
.result{font-family:var(--f-arc);font-weight:400;font-size:clamp(60px,11vw,140px);line-height:1;margin:14px 0 18px;color:#fff;text-shadow:5px 5px 0 rgba(0,0,0,.6),0 0 24px var(--n0)}
.result sup{font-size:.4em;vertical-align:top}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 26px;justify-content:start;font-size:clamp(16px,1.8vw,22px)}
.stats span:nth-child(odd){color:var(--dim)}
.record{color:var(--n0)}
#loading{position:absolute;left:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#rewind{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:20px;font-size:clamp(36px,5vw,64px)}
#touch{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
#touch .grp{display:flex;gap:9px;pointer-events:auto}
#touch button{width:66px;height:66px;border-radius:50%;border:2px solid rgba(243,238,248,.35);background:rgba(10,6,20,.45);color:var(--osd);
  font-family:var(--f-eva);font-weight:800;font-size:15px;touch-action:none}
#touch button.on{background:rgba(255,255,255,.18);border-color:#fff}
#touch button.nos{border-color:var(--n0)}
#touch button.dft{border-color:var(--n1)}
body.touch .bl{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.touch .br{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.touch .controls{display:none}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
button:focus-visible{outline:2px solid var(--n1);outline-offset:3px}
@media (prefers-reduced-motion:reduce){ .blink{animation:none} }
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud" hidden>
    <div class="corner tl term tbox">
      <div class="dim">NIGHT TAPE MONITOR V0.4</div>
      <div class="dim" id="tapeLine">TAPE 01 // UPPER CITY</div>
      <div>&gt; <span id="lap">LAP 1/3</span><span class="blink">█</span></div>
    </div>
    <div class="corner tr term tbox" style="align-items:flex-end"><div class="dim">POSITION</div><div id="pos" class="posbig">-</div></div>
    <div class="corner bl term tbox tgrid">
      <span class="dim">TIME</span><span class="inv" id="clock">0:00.0</span>
      <span class="dim">LAP</span><span id="lapClock">0:00.0</span>
      <span class="dim">BEST</span><span id="best">--:--.-</span>
    </div>
    <div class="corner br"><canvas id="instr" width="330" height="184" aria-label="Speed, nitro and engine readout"></canvas></div>
    <div id="toast" class="term"></div>
  </div>

  <div id="title" class="screen">
    <div class="ep">第四話 ― 深夜放送</div>
    <h1 class="evatitle"><span class="l1">NIGHT</span><span class="l2">TAPE</span></h1>
    <div class="jp" id="trackJp">上層街、三周。</div>
    <div class="hits" id="titleHits">
      <button type="button" data-hit="play" id="hitPlay" aria-label="Play"></button>
      <button type="button" data-hit="settings" id="openSettings" aria-label="Settings"></button>
      <button type="button" data-hit="records" id="openRecords" aria-label="Records"></button>
      <button type="button" data-hit="tapePrev" aria-label="Previous tape"></button>
      <button type="button" data-hit="tapeNext" aria-label="Next tape"></button>
      <button type="button" data-hit="palPrev" aria-label="Previous palette"></button>
      <button type="button" data-hit="palNext" aria-label="Next palette"></button>
      <button type="button" data-hit="modeSolo" aria-label="Single player"></button>
      <button type="button" data-hit="modeLink" aria-label="Multiplayer link"></button>
      <button type="button" data-hit="diff0" aria-label="Easy"></button>
      <button type="button" data-hit="diff1" aria-label="Medium"></button>
      <button type="button" data-hit="diff2" aria-label="Hard"></button>
      <button type="button" data-hit="diff3" aria-label="Ghost race"></button>
    </div>
  </div>

  <div id="lobby" class="screen" hidden>
    <div class="hits" id="lobbyHits">
      <input data-hit="nameIn" id="nameIn" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Callsign">
      <input data-hit="roomIn" id="roomIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code">
      <button type="button" data-hit="lbCopy" aria-label="Copy invite link"></button>
      <button type="button" data-hit="lbNew" aria-label="New room"></button>
      <button type="button" data-hit="lbTapePrev" aria-label="Previous tape"></button>
      <button type="button" data-hit="lbTapeNext" aria-label="Next tape"></button>
      <button type="button" data-hit="lbReady" aria-label="Ready"></button>
      <button type="button" data-hit="lbStart" aria-label="Start race"></button>
      <button type="button" data-hit="lbBack" aria-label="Back"></button>
    </div>
  </div>

  <div id="pause" class="screen" hidden>
    <div class="hits" id="pauseHits">
      <button type="button" data-hit="resume" id="resumeBtn" aria-label="Resume"></button>
      <button type="button" data-hit="rewind" id="pRewind" aria-label="Rewind and restart"></button>
      <button type="button" data-hit="pSettings" id="pauseSettings" aria-label="Settings"></button>
      <button type="button" data-hit="tapes" id="toTapes" aria-label="Back to tapes"></button>
      <button type="button" data-hit="pPalPrev" aria-label="Previous palette"></button>
      <button type="button" data-hit="pPalNext" aria-label="Next palette"></button>
    </div>
  </div>

  <div id="records" class="screen" hidden>
    <div class="hits" id="recHits">
      <button type="button" data-hit="recBack" id="recBack" aria-label="Back"></button>
      <button type="button" data-hit="recClear" id="recClear" aria-label="Clear records"></button>
      <button type="button" data-hit="recPrev" aria-label="Previous tape"></button>
      <button type="button" data-hit="recNext" aria-label="Next tape"></button>
    </div>
  </div>

  <div id="settings" class="screen" hidden>
    <div class="vtitle">SETTINGS</div>
    <div class="picks tabs" id="setTabs" role="tablist">
      <button type="button" data-tab="graphics" aria-pressed="true">GRAPHICS</button><button type="button" data-tab="audio" aria-pressed="false">AUDIO</button><button type="button" data-tab="controls" aria-pressed="false">CONTROLS</button>
    </div>
    <div class="setgrid" id="setBody"></div>
    <div class="picks" style="margin-top:22px"><button type="button" id="setBack">◀ BACK [ESC]</button><button type="button" id="setReset">RESET THIS TAB</button></div>
    <div class="sub" style="margin-top:10px">CHANGES SAVE AUTOMATICALLY</div>
  </div>

  <div id="finish" class="screen" hidden>
    <div class="hits" id="finishHits">
      <button type="button" data-hit="fRewind" aria-label="Rewind and race again"></button>
      <button type="button" data-hit="fRecords" aria-label="Records"></button>
      <button type="button" data-hit="fTapes" aria-label="Back to tapes"></button>
    </div>
  </div>

  <div id="loading" class="osd" hidden>LOADING TAPE<span class="blink">…</span></div>
  <div id="rewind" class="osd" hidden>◀◀ REWIND</div>
  <div id="count" class="term"></div>

  <div id="touch" hidden>
    <div class="grp"><button id="tL" aria-label="Steer left">◀</button><button id="tR" aria-label="Steer right">▶</button></div>
    <div class="grp"><button id="tB" aria-label="Brake">BRK</button><button id="tD" class="dft" aria-label="Drift">DRIFT</button><button id="tN" class="nos" aria-label="Nitro">NOS</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

addEventListener('keydown', e => {

  if (e.repeat) return;
  if (settingsOpen && overlay === 'lobby') {
    if (e.code === 'Escape') closeOverlay();

    else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') cycleTape(e.code === 'ArrowLeft' ? -1 : 1);
    else if (e.code === 'KeyN') { e.preventDefault(); $('nameIn').focus(); }
    else if (e.code === 'KeyJ') { e.preventDefault(); $('roomIn').focus(); $('roomIn').select(); }

    return;
  }
  if (settingsOpen) {
    if (e.code === 'Escape') closeOverlay();
    else if (overlay === 'records' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) HIT_ACTIONS[e.code === 'ArrowLeft' ? 'recPrev' : 'recNext']();
    else if (overlay === 'records' && e.code === 'KeyC') clearRecords();
    return;
  }
  if ((state === 'title' || state === 'paused') && e.code === 'KeyS') { openSettings(); return; }
  if (state === 'finished' && e.code === 'KeyT' && !$('finish').hidden) { openRecords(); return; }
  if (state === 'paused' && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) { cyclePal(e.code === 'ArrowUp' ? -1 : 1); return; }
  if (state === 'title' && e.code === 'KeyR') { openRecords(); return; }
  if (state === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) { cycleTape(e.code === 'ArrowLeft' ? -1 : 1); return; }
  if (state === 'title' && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) { cyclePal(e.code === 'ArrowUp' ? -1 : 1); return; }
  if (state === 'title' && e.code === 'KeyL') { setLinkMode(!linkMode); return; }
  if (state === 'title' && e.code === 'KeyD' && !linkMode) { setDiff(diffIdx + 1); return; }
  if (e.code === 'Enter' && state === 'title') primaryAction();
  else if (e.code === 'Enter' && state === 'finished') HIT_ACTIONS.fRewind();
  else if (e.code === 'KeyR' && (state === 'finished' || state === 'paused' || state === 'race')) rewind();
  else if ((e.code === 'Escape' || e.code === 'KeyQ') && state === 'finished') toTitle();
  else if ((e.code === 'Escape' || e.code === 'KeyP') && raceMode === 'link' && (state === 'race' || state === 'countdown')) leaveLinkPrompt();
  else if (e.code === 'KeyQ' && state === 'paused') toTitle();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') setMute(!muted);
  else if (e.code === 'KeyV') { cyclePal(1); toast('PALETTE ' + PALETTES[palIdx].name); }
  else if (e.code === 'KeyC') { camMode = 1 - camMode; toast(camMode ? 'CAM 2 · HOOD' : 'CAM 1 · CHASE'); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'race' && raceMode !== 'link') togglePause(); });
$('title').addEventListener('pointerdown', () => primaryAction());
$('finish').addEventListener('pointerdown', () => { if (state === 'finished') HIT_ACTIONS.fRewind(); });
$('pause').addEventListener('pointerdown', () => { if (state === 'paused') togglePause(); });
const bindBtn = (id, k) => {
  const b = $(id);
  const on = e => { e.preventDefault(); touch[k] = true; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { touch[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
};
bindBtn('tL', 'L'); bindBtn('tR', 'R'); bindBtn('tB', 'B'); bindBtn('tN', 'N'); bindBtn('tD', 'D');

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);
  const now = performance.now() / 1000;
  if (!TR) { renderer.render(scene, camera); return; }

  if (state === 'title' || state === 'loading') {
    cars.forEach(c => aiDrive(c, dt, false)); collide(); cars.forEach(c => placeCar(c, dt));
    updateCamera(dt, 'attract');
  } else if (state === 'countdown') {
    countT -= dt;
    const n = Math.ceil(countT);
    if (n !== lastCount) { lastCount = n; const el = $('count'); el.textContent = n > 0 ? n : 'GO'; el.style.opacity = 1; sfx.beep(n > 0 ? 440 : 880, n > 0 ? .18 : .5); }
    $('count').style.opacity = Math.max(0, countT - Math.floor(countT)) * 1.2;
    updatePhantoms(dt);
    if (countT <= 0) { state = 'race'; raceWall0 = performance.now() / 1000; $('count').style.opacity = 1; setTimeout(() => { $('count').style.opacity = 0; }, 500); }
    cars.forEach(c => placeCar(c, dt));
    updateCamera(dt, 'race'); updateHUD(dt);
  } else if (state === 'race' || state === 'finished') {
    raceTime += state === 'race' ? dt : 0;
    if (state === 'race') playerDrive(dt); else aiDrive(player, dt, false);
    cars.forEach(c => { if (!c.isPlayer && !c.phantom) aiDrive(c, dt, true); });
    updatePhantoms(dt);
    collide();
    if (state === 'race' && recRun) while (recRun.n * GHOST_DT <= raceTime) recSample();
    cars.forEach(c => {
      const li = Math.floor(c.d / L);
      if (li > c.lapIdx) {
        c.lapIdx = li;
        if (li >= 1 && c.isPlayer && state === 'race') {
          const lt = raceTime - c.lapStart; c.lapTimes.push(lt); c.lapStart = raceTime;
          let msg = `LAP ${li} ${fmt(lt)}`;
          if (bestLap == null || lt < bestLap) { bestLap = lt; store.set(bestKey('bestLap'), lt); msg += ' · BEST'; c.lapRec = true; }
          if (li < LAPS) toast(li === LAPS - 1 ? msg + ' · FINAL LAP' : msg);
        }
        if (li >= LAPS && !c.finished && !c.isPlayer && !c.phantom) { c.finished = true; c.finishTime = raceTime; }
      }
    });
    if (state === 'race' && player.d >= LAPS * L) finishRace();
    cars.forEach(c => placeCar(c, dt));
    if (state === 'race') emitSkid(dt);
    updateCamera(dt, 'race'); updateHUD(dt);
  } else if (state === 'rewind') {
    rewindT -= dt;
    cars.forEach(c => { c.d -= 140 * dt; placeCar(c, dt); });
    updateCamera(dt, 'race');
    if (rewindT <= 0) { show('rewind', false); startRace(); }
  }

  if (raceMode === 'link' && NET.race && inRace()) { netSendT -= dt; if (netSendT <= 0) { netSendT = 1 / 12; const p = player;
    NET.send('st', {t: +(performance.now() / 1000 - raceWall0).toFixed(3), d: +p.d.toFixed(2), x: +p.x.toFixed(2), y: +p.yaw.toFixed(3), v: +p.v.toFixed(2), dr: p.drift ? 1 : 0, f: p.finished ? 1 : 0, ft: p.finished ? +p.finishTime.toFixed(2) : 0, lap: Math.min(LAPS, Math.floor(p.d / L) + 1)}); } }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').classList.remove('on'); }
  shake = Math.max(0, shake - dt * 2);
  glitch = Math.max(0, glitch - dt * (state === 'rewind' ? .4 : 1.6));

  const cp = camera.position;
  if (player) { _hp.copy(player.group.position); _hp.y += .8; _hd.set(0, 0, 1).applyQuaternion(player.group.quaternion); }
  if (rain.visible) {
    camera.getWorldDirection(_t); const yaw = Math.atan2(-_t.x, -_t.z), cs = Math.cos(yaw), sn = Math.sin(yaw);
    rain.position.copy(cp); rain.rotation.set(0, yaw, 0);
    // the faster you go, the flatter and longer the streaks get
    const tgtS = player && (state === 'race' || state === 'finished') ? clamp(player.v / 95, 0, 1.1) : 0;
    rainSpeed += (tgtS - rainSpeed) * Math.min(1, dt * 2.5);
    const th = (45 + 34 * rainSpeed) * Math.PI / 180, len = RLEN * (1 + .9 * rainSpeed);
    const d = rainDrops, a = rainPos, c = rainCol, fall = (36 + 55 * rainSpeed) * dt;
    const fy = fall * Math.cos(th), fz = fall * Math.sin(th) * 1.1, ty = len * Math.cos(th), tz = len * Math.sin(th);
    for (let i = 0, n = 0; i < d.length; i += 3, n++) {
      d[i+1] -= fy; d[i+2] -= fz;
      if (d[i+1] < -RBY) d[i+1] += RBY * 2;
      if (d[i+2] < -RBX) d[i+2] += RBX * 2;
      const x = d[i], y = d[i+1], z = d[i+2], o = n * 12;
      a[o] = x - RW; a[o+1] = y; a[o+2] = z;  a[o+3] = x + RW; a[o+4] = y; a[o+5] = z;
      a[o+6] = x - RW; a[o+7] = y + ty; a[o+8] = z + tz;  a[o+9] = x + RW; a[o+10] = y + ty; a[o+11] = z + tz;
      lightAt(cp.x + x * cs + z * sn, cp.y + y, cp.z - x * sn + z * cs, _lc, .02);
      for (let k = 0; k < 12; k += 3) { c[o+k] = _lc.r; c[o+k+1] = _lc.g; c[o+k+2] = _lc.b; }
    }
    rainGeo.attributes.position.needsUpdate = true; rainGeo.attributes.color.needsUpdate = true;
  }
  if (snow.visible && state !== 'paused') {
    const a = snowPos;
    for (let i = 0; i < a.length; i += 3) {
      a[i+1] -= (4 + (i % 7)) * dt; a[i] += Math.sin(now * .7 + i) * 1.2 * dt;
      if (a[i+1] < cp.y - 25) a[i+1] += 70;
      if (a[i+1] > cp.y + 45) a[i+1] -= 70;
      a[i] = cp.x + mod(a[i] - cp.x + 90, 180) - 90;
      a[i+2] = cp.z + mod(a[i+2] - cp.z + 90, 180) - 90;
    }
    snowGeo.attributes.position.needsUpdate = true;
  }
  sky.position.copy(cp);
  sky.material.uniforms.uTime.value = now;
  updateFogBanks(dt);
  if (world.coneMats) for (const m of world.coneMats) { m.uniforms.uFogD.value = scene.fog.density; m.uniforms.uTime.value = now; }
  updateSteam(now);
  if (world.flames) for (const f of world.flames) { const fl = .8 + .25 * Math.sin(now * 17 + f.ph) + .15 * Math.sin(now * 31 + f.ph * 2); f.o.scale.setScalar(2.2 * fl); f.i.scale.setScalar(1.0 * fl); f.o.material.opacity = .75; }
  if (world.roofMat) world.roofMat.opacity = .35 + .65 * (Math.sin(now * 3) > .2 ? 1 : 0);
  if (state !== 'paused') { updateNeonLights(); updateSmoke(dt); updateTraffic(dt); updateRipples(dt, state === 'title' || state === 'loading' ? attractS : player ? player.d : 0); }
  if (player) {
    const tb = player.boosting && state === 'race' ? 1 : 0;
    boostS += (tb - boostS) * Math.min(1, dt * (tb ? 5 : 2.5));
    const gn = 1 + .45 * boostS;
    if (Math.abs(gn - neonGain) > .01) tintMats(gn);
  }
  updateEngine();

  postMat.uniforms.uTime.value = now;
  hitFx = Math.max(0, hitFx - dt * 1.5);
  if (player && player.nitroFlash > 0) player.nitroFlash = Math.max(0, player.nitroFlash - dt);
  if (hitFx > 0 && player) { _hitV.copy(player.group.position); _hitV.y += .7; _hitV.project(camera); postMat.uniforms.uHit.value.set(_hitV.y * .5 + .5, hitFx * (.5 + .5 * S.vhs / 100)); }
  else postMat.uniforms.uHit.value.set(0, 0);
  postMat.uniforms.uGlitch.value = glitch;
  postMat.uniforms.uBoost.value = boostS;
  { const menuUp = !settingsOpen && (state === 'paused' || (state === 'finished' && !$('finish').hidden));
    postMat.uniforms.uDim.value.set((state === 'title' && !settingsOpen) || menuUp ? 1 : 0, overlay === 'records' || overlay === 'lobby' ? 1 : menuUp ? .35 : 0); }
  updateGlare();
  postMat.uniforms.uVhs.value = S.vhs / 100; postMat.uniforms.uBloom.value = S.bloom / 100; postMat.uniforms.uBlur.value = S.nitroBlur ? 1 : 0;
  postMat.uniforms.uSpeed.value = player && state === 'race' ? (player.boosting ? 1 : player.v / 100) : 0;
  drawHud();
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

/* ---------- boot ---------- */
initSelectors(); initSettings(); initRecords(); applyPrecip();
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.all([document.fonts.load('800 64px "NT Eva"', 'NIGHT'), document.fonts.load('10px "Press Start 2P"', '0123456789KMH'), document.fonts.load('20px "VT323"', 'DRIVE.SYS 0123456789 KM/H GEAR N2O RPM'), document.fonts.load('16px "DotGothic16"', 'TAPE POSITION 0123456789 KM/H GEAR N2O SPD #.[]~$@ LAPTIMEBEST あんたバカ？街雪'), document.fonts.load('800 64px "Shippori Mincho B1"', vTexts.join('') + '雪管制区第二検問三五下层ABCDEFGHIJKLMNOPQRSTUVWXYZ')]).catch(() => {})
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2200))]).then(() => {
  buildWorld(); makeCars(); applyPalette();
  cars.forEach((c, i) => { resetCar(c, i); c.d = i * 70 + 200; c.v = 50; });
  state = 'title';
  const qr = cleanCode(new URLSearchParams(location.search).get('room'));
  if (qr.length >= 3) { NET.code = qr; linkMode = true; store.set('nt_mode', 'link'); openLobby(); }
  else if (linkMode) netJoin(NET.code);
});
tick();
})();
