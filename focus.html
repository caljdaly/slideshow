<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Strip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0a0c12; --surface: #12151e; --surface-2: #1a1e2a; --line: #262b3a;
    --text: #e7eaf3; --muted: #7e8799;
    --violet: #7c5cff; --cyan: #4fd1ff; --magenta: #ff6bd6; --accent: #c9a0ff; --accent-ink: #1b0f2e;
    --display: "Chakra Petch", "Bahnschrift", "DIN Alternate", sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--body); font-size: 13px; line-height: 1.4; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .frame { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  .viz { position: relative; height: 76px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(124,92,255,.05), transparent 45%, rgba(79,209,255,.04)), var(--ground); overflow: hidden; }
  .viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .viz::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }

  .body { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 16px; min-height: 0; }
  .phase { font-family: var(--display); font-weight: 600; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .phase .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .phase.work .dot { background: var(--violet); box-shadow: 0 0 10px var(--violet); }
  .phase.break .dot { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .time { font-family: var(--display); font-weight: 600; font-size: 44px; letter-spacing: .06em; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 4px; }
  .time.idle { color: var(--muted); }
  .tally { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .tally div { font-family: var(--display); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tally b { display: block; font-size: 16px; letter-spacing: .04em; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .tally .pips { display: flex; gap: 4px; margin-top: 5px; }
  .tally .pip { width: 8px; height: 8px; border: 1px solid var(--line); }
  .tally .pip.on { background: var(--violet); border-color: var(--violet); box-shadow: 0 0 6px var(--violet); }

  .controls { display: flex; flex-direction: column; gap: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface);
    font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; transition: border-color .15s, color .15s, background .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 116px; }
  .btn.primary:hover { background: #dcbfff; color: var(--accent-ink); }
  .btn.small { height: 28px; font-size: 10px; padding: 0 10px; }
  .row { display: flex; gap: 6px; }
  .rail { border-top: 1px solid var(--line); padding: 6px 16px; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .rail button { color: var(--muted); font-family: inherit; font-size: inherit; letter-spacing: inherit; text-transform: inherit; }
  .rail button:hover { color: var(--accent); }
  .rail button[aria-pressed="true"] { color: var(--accent); }
  @media (max-width: 420px) { .time { font-size: 36px; } .btn.primary { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
  <div class="viz" aria-hidden="true"><canvas id="viz"></canvas></div>
  <div class="body">
    <div>
      <div class="phase" id="phase"><span class="dot"></span><span id="phaseText">ready</span></div>
      <div class="time idle" id="time">25:00</div>
      <div class="tally">
        <div>today<b id="todayCount">0</b><div class="pips" id="pips"></div></div>
        <div>minutes<b id="todayMin">0</b></div>
        <div>streak<b id="streak">0d</b></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="startBtn" type="button">Start</button>
      <div class="row">
        <button class="btn small" id="skipBtn" type="button" title="Skip to the next phase">Skip</button>
        <button class="btn small" id="resetBtn" type="button" title="Reset this phase">Reset</button>
      </div>
    </div>
  </div>
  <div class="rail">
    <span id="plan">25 · 5 · long 15 every 4</span>
    <button id="soundBtn" type="button" aria-pressed="true">sound on</button>
  </div>
</div>

<script>
(function () {
  const WORK = 25, SHORT = 5, LONG = 15, LONG_EVERY = 4;   // minutes
  const LOG_KEY = 'study-log';                              // shared with heatmap.html

  const $ = (id) => document.getElementById(id);
  const el = { phase: $('phase'), phaseText: $('phaseText'), time: $('time'), todayCount: $('todayCount'), todayMin: $('todayMin'),
    streak: $('streak'), pips: $('pips'), startBtn: $('startBtn'), skipBtn: $('skipBtn'), resetBtn: $('resetBtn'), soundBtn: $('soundBtn') };

  // ---- study log (per day) ------------------------------------------------
  const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function readLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '{}'); } catch (_) { return {}; } }
  function writeLog(log) { try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (_) {} }
  function logSession(minutes) {
    const log = readLog(); const k = dayKey();
    const d = log[k] || { sessions: 0, minutes: 0 };
    d.sessions += 1; d.minutes += minutes; log[k] = d; writeLog(log);
  }
  function streakDays(log) {
    let n = 0; const d = new Date();
    if (!log[dayKey(d)]) d.setDate(d.getDate() - 1);           // today doesn't count against you until it's over
    while (log[dayKey(d)] && log[dayKey(d)].sessions > 0) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function renderTally() {
    const log = readLog(); const t = log[dayKey()] || { sessions: 0, minutes: 0 };
    el.todayCount.textContent = t.sessions; el.todayMin.textContent = t.minutes; el.streak.textContent = streakDays(log) + 'd';
    el.pips.replaceChildren();
    for (let i = 0; i < Math.max(LONG_EVERY, Math.min(t.sessions, 12)); i++) { const p = document.createElement('span'); p.className = 'pip' + (i < t.sessions ? ' on' : ''); el.pips.appendChild(p); }
  }
  window.addEventListener('storage', (e) => { if (e.key === LOG_KEY) renderTally(); });

  // ---- timer ----------------------------------------------------------------
  let phase = 'work';            // 'work' | 'break'
  let running = false;
  let endAt = 0, remaining = WORK * 60;   // seconds
  let sessionsThisCycle = 0;
  let sound = true;
  let tickTimer = null;

  const phaseLen = () => phase === 'work' ? WORK * 60 : (sessionsThisCycle % LONG_EVERY === 0 ? LONG : SHORT) * 60;

  function beep(kind) {
    if (!sound) return;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const notes = kind === 'work-done' ? [523, 659, 784] : [659, 523];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        const t = ac.currentTime + i * 0.18;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.start(t); o.stop(t + 0.4);
      });
    } catch (_) {}
  }

  function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

  function render() {
    el.time.textContent = fmt(remaining);
    el.time.classList.toggle('idle', !running);
    el.phase.className = 'phase ' + phase;
    el.phaseText.textContent = running ? (phase === 'work' ? 'focus' : (phaseLen() === LONG * 60 ? 'long break' : 'break')) : (phase === 'work' ? 'ready' : 'break · paused');
    el.startBtn.textContent = running ? 'Pause' : (remaining < phaseLen() ? 'Resume' : 'Start');
    document.title = (running ? fmt(remaining) + ' · ' : '') + (phase === 'work' ? 'Focus' : 'Break');
  }

  function start() { running = true; endAt = Date.now() + remaining * 1000; clearInterval(tickTimer); tickTimer = setInterval(tick, 250); render(); }
  function pause() { running = false; remaining = Math.max(0, (endAt - Date.now()) / 1000); clearInterval(tickTimer); render(); }
  function finish(natural) {
    running = false; clearInterval(tickTimer);
    if (phase === 'work') {
      if (natural) { sessionsThisCycle++; logSession(WORK); renderTally(); beep('work-done'); }
      phase = 'break';
    } else {
      if (natural) beep('break-done');
      phase = 'work';
    }
    remaining = phaseLen(); render();
    if (natural) start();          // roll straight into the next phase; pause is one click away
  }
  function tick() {
    remaining = (endAt - Date.now()) / 1000;
    if (remaining <= 0) { remaining = 0; finish(true); return; }
    render();
  }

  el.startBtn.addEventListener('click', () => running ? pause() : start());
  el.skipBtn.addEventListener('click', () => finish(false));
  el.resetBtn.addEventListener('click', () => { running = false; clearInterval(tickTimer); remaining = phaseLen(); render(); });
  el.soundBtn.addEventListener('click', () => { sound = !sound; el.soundBtn.setAttribute('aria-pressed', sound); el.soundBtn.textContent = sound ? 'sound on' : 'sound off'; });
  document.addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); el.startBtn.click(); } });

  // ---- LED strip: fills over a work block, drains over a break -------------
  (function () {
    const canvas = $('viz'), ctx = canvas.getContext('2d');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0;
    function resize() { const dpr = Math.min(window.devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    function color(x, a) {
      const s = [[124, 92, 255], [79, 209, 255], [255, 107, 214]];
      const p = x < 0.72 ? x / 0.72 : (x - 0.72) / 0.28; const [c0, c1] = x < 0.72 ? [s[0], s[1]] : [s[1], s[2]];
      return 'rgba(' + Math.round(c0[0] + (c1[0] - c0[0]) * p) + ',' + Math.round(c0[1] + (c1[1] - c0[1]) * p) + ',' + Math.round(c0[2] + (c1[2] - c0[2]) * p) + ',' + a + ')';
    }
    function draw(now) {
      const t = now / 1000;
      ctx.clearRect(0, 0, W, H);
      const gap = 3, bw = 4, step = bw + gap, n = Math.max(24, Math.floor((W - 16) / step)), x0 = (W - n * step + gap) / 2;
      const mid = H / 2, maxH = H * 0.47, seg = 3, segGap = 1;
      const total = phaseLen(); const done = 1 - remaining / total;      // 0..1
      const fillTo = phase === 'work' ? done : 1 - done;                  // work fills, break drains
      ctx.fillStyle = 'rgba(124,92,255,.18)'; ctx.fillRect(x0, mid - 0.5, n * step - gap, 1);
      for (let i = 0; i < n; i++) {
        const x = i / (n - 1);
        const lit = x <= fillTo;
        // lit bars breathe gently; unlit bars sit as a faint stub
        const breathe = 0.5 + 0.5 * Math.sin(x * 6 + t * (running ? 0.9 : 0.3)) * 0.5 + 0.25 * Math.sin(x * 13 - t * 0.6);
        const edge = 0.55 + 0.45 * Math.sin(Math.PI * x);
        const h = lit ? maxH * edge * (0.35 + 0.65 * breathe) : maxH * 0.06;
        const segs = Math.max(1, Math.floor(h / (seg + segGap)));
        for (let s = 0; s < segs; s++) {
          const a = lit ? Math.min(0.92, 0.35 + 0.55 * (1 - s / Math.max(segs, 6))) : 0.35;
          ctx.fillStyle = lit ? color(x, a) : 'rgba(126,135,153,.25)';
          const y = s * (seg + segGap) + 1;
          ctx.fillRect(x0 + i * step, mid - y - seg, bw, seg); ctx.fillRect(x0 + i * step, mid + y, bw, seg);
        }
      }
      // the leading edge glows
      const ex = x0 + fillTo * (n * step - gap);
      const g = ctx.createRadialGradient(ex, mid, 0, ex, mid, 26);
      g.addColorStop(0, 'rgba(79,209,255,' + (running ? 0.28 : 0.12) + ')'); g.addColorStop(1, 'rgba(79,209,255,0)');
      ctx.fillStyle = g; ctx.fillRect(ex - 26, mid - 26, 52, 52);
      if (!reduced) requestAnimationFrame(draw);
    }
    resize(); window.addEventListener('resize', resize);
    if (reduced) { draw(0); setInterval(() => draw(performance.now()), 1000); } else requestAnimationFrame(draw);
  })();

  renderTally(); render();
})();
</script>
</body>
</html>
